{% extends "base.html" %}

{% block title %}Ingreso{% endblock %}

{% block content %}
<section class="login-shell" aria-labelledby="login-title">
  <div class="login-panel">
    <div class="login-brand-mark">
      <img src="/static/generated/logo.png" alt="Green Global Group">
    </div>
    <p class="eyebrow">Acceso seguro</p>
    <h1 id="login-title">Recepción Green Global</h1>
    <p class="login-welcome">Ingresa con tu cuenta para continuar.</p>
    <form class="form-stack" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label><span>Usuario</span><input name="username" autocomplete="username" required autofocus></label>
      <label><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required></label>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <button class="button login-submit" type="submit">
        <span>Ingresar</span>{{ icons.icon("arrow-right") }}
      </button>
    </form>
    <p class="login-company">Green Global Group</p>
    <p class="login-signature">Aplicativo desarrollado por <strong>ANGEL SISTEMS</strong></p>
  </div>
</section>
{% endblock %}
