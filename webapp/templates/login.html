{% extends "base.html" %}

{% block title %}Ingreso{% endblock %}

{% block content %}
<section class="login-shell">
  <div class="login-panel">
    <img src="/static/generated/logo.png" alt="">
    <p class="eyebrow">Acceso seguro</p>
    <h1>Recepción Green Global</h1>
    <form class="form-stack" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Usuario<input name="username" autocomplete="username" required autofocus></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <button class="button" type="submit">Ingresar</button>
    </form>
  </div>
</section>
{% endblock %}
