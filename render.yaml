services:
  - type: web
    name: recepcion-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GITHUB_BACKUP_REPO
        value: cmaynn-sudo/APPGGG
      - key: GITHUB_BACKUP_BRANCH
        value: app-data
      - key: GITHUB_BACKUP_PATH
        value: recepcion-state/state.zip
      - key: GITHUB_BACKUP_RESTORE_ON_START
        value: "true"
      - key: GITHUB_BACKUP_TOKEN
        sync: false
